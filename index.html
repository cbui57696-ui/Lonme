<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSpam Panel</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background-color: #1a1a1a; padding: 30px; border-radius: 10px; border: 1px solid #333; width: 300px; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); }
        h2 { text-align: center; color: #00ffcc; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; background: #000; border: 1px solid #444; color: #00ffcc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00ffcc; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; cursor: not-allowed; }
        #log { margin-top: 15px; color: #aaa; font-size: 13px; font-family: monospace; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="box">
        <h2>SPAM PANEL</h2>
        <input type="text" id="phone" placeholder="Số điện thoại (VD: 849...)">
        <input type="number" id="amount" placeholder="Số lượng">
        <button id="btn" onclick="start()">BẮT ĐẦU</button>
        <div id="log"></div>
    </div>

    <script>
        async function start() {
            let phone = document.getElementById("phone").value;
            let amount = document.getElementById("amount").value;
            let btn = document.getElementById("btn");
            let log = document.getElementById("log");

            if (!phone || !amount) { alert("Nhập đủ SĐT và Số lượng!"); return; }

            btn.disabled = true;
            log.innerText = "Đang kết nối tới Server (có thể mất 50s nếu Server đang ngủ)...";

            try {
                // Đã gắn link Render của He vào đây
                let res = await fetch('https://lonme-2.onrender.com/api/spam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, amount: parseInt(amount) })
                });
                let data = await res.json();
                log.innerText = data.message;
            } catch (e) {
                log.innerText = "Lỗi kết nối Server!";
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
